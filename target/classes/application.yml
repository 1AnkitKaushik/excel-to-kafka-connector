server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: file-connector-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

file-connector:
  watch-path: ${WATCH_DIR:./data/input}
  processed-directory: ${PROCESSED_DIR:./data/processed}
  kafka-topic: ${KAFKA_TOPIC:excel-file-updates}
  sheet-index: ${SHEET_INDEX:0}
  read-delay-ms: ${READ_DELAY_MS:500}